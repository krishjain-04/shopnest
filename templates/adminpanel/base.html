{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShopNest Admin Console{% endblock %}</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome 6.5.1 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom Master Admin Stylesheet -->
    <link rel="stylesheet" href="{% static 'admincss/admindashboard.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Mobile Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Sidebar Navigation -->
    {% include 'adminpanel/includes/sidebar.html' %}

    <!-- Main Wrapper Area -->
    <div class="admin-main">
        <!-- Top Navbar -->
        {% include 'adminpanel/includes/navbar.html' %}

        <!-- Main Body Content -->
        <main class="content-container">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Master Admin Custom JS -->
    <script src="{% static 'adminjs/admin_custom.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
