{% extends "client/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <h3 class="fw-bold text-center mb-4">Change Password</h3>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="old_password" class="form-label fw-semibold">Current Password</label>
                        <div class="input-group">
                            <input type="password" name="old_password" id="old_password" class="form-control" placeholder="Enter current password" required>
                            <button class="btn btn-outline-secondary input-group-text-btn" type="button" onclick="togglePassword('old_password', 'oldPassIcon')">
                                <i class="fa-regular fa-eye" id="oldPassIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Enter new password" required>
                            <button class="btn btn-outline-secondary input-group-text-btn" type="button" onclick="togglePassword('new_password', 'newPassIcon')">
                                <i class="fa-regular fa-eye" id="newPassIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                        <div class="input-group">
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm new password" required>
                            <button class="btn btn-outline-secondary input-group-text-btn" type="button" onclick="togglePassword('confirm_password', 'confirmPassIcon')">
                                <i class="fa-regular fa-eye" id="confirmPassIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="{% url 'profile' %}" class="btn btn-light">Back to Profile</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
{% endblock %}
